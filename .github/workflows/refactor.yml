name: Refactor validation

'on':
  push:
    branches:
      - refactor
    paths:
      - ".github/workflows/refactor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor
          fetch-depth: 0

      - name: Validate workflow YAML
        run: "ruby -e 'require \"yaml\"; YAML.load_file(\".github/workflows/refactor.yml\", aliases: true)'"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply safe App.jsx extraction
        run: python3 .github/scripts/refactor_app.py

      - name: Validate JavaScript build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit validated refactor
        run: |
          if git diff --quiet; then
            echo "No refactor changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/services/audioRecorder.js
          git commit -m "refactor: extract audio recorder and Firebase services [skip ci]"
          git push origin refactor
